[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
# 0.x.y: a new feature raises x (y back to 0), a fix raises y. See AGENTS.md.
version = "0.41.0"
edition = "2024"
rust-version = "1.99"
publish = false
# Dual licence, as most of the Rust ecosystem.
license = "MIT OR Apache-2.0"
repository = "https://github.com/jurjen-broeke/snappiesnap"

[workspace.dependencies]
snappiesnap-seq = { path = "crates/seq" }
snappiesnap-formats = { path = "crates/formats" }
snappiesnap-doc = { path = "crates/doc" }
snappiesnap-bio = { path = "crates/bio" }
snappiesnap-layout = { path = "crates/layout" }
snappiesnap-render = { path = "crates/render" }
snappiesnap-io = { path = "crates/io" }
snappiesnap-engine = { path = "crates/engine" }
snappiesnap-ui-egui = { path = "crates/ui-egui" }
snappiesnap-mcp = { path = "crates/mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
toml = "0.8"
proptest = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = "0.37"
rfd = "0.17"
tiny-skia = "0.12"
png = "0.18"
# SVG rasteriser (Apache-2.0 OR MIT), xtask only: renders the icon pack from the brand SVG.
resvg = { version = "0.49", default-features = false }
# Windows resources (MIT), build script only: the icon embedded in snappiesnap.exe.
embed-resource = "3"
# Image files (MIT OR Apache-2.0), desktop only: saving gels as JPEG (PNG is written with `png`).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# xz/LZMA, pure Rust (MIT): SnapGene .dna history packets.
lzma-rs = "0.3"
miniz_oxide = "0.8"
# The web build (MIT OR Apache-2.0): browser APIs from Rust, no handwritten JavaScript.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Never crash (AGENTS.md): enforced for every crate through `[lints] workspace = true`
# (checked by `cargo xtask lints`). `clippy.toml` relaxes the panic lints in tests only.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# Keep unwinding so the engine's last-resort `catch_unwind` guard can recover.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
