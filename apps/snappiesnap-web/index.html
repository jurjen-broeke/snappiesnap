<!DOCTYPE html>
<!-- SnappieSnap in the browser. Built with trunk (see docs/web.md); trunk adds the generated
     loader for the WebAssembly module. There is no handwritten JavaScript. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SnappieSnap</title>
  <link data-trunk rel="rust" data-bin="snappiesnap-web" data-wasm-opt="z">
  <link data-trunk rel="copy-file" href="../../assets/brand/icons/web/favicon.svg">
  <link data-trunk rel="copy-file" href="../../assets/brand/icons/web/favicon.ico">
  <link data-trunk rel="copy-file" href="../../assets/brand/icons/web/apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #1b1b1b; color: #ddd; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: light) { body { background: #f4f4f4; color: #222; } }
    canvas#snappiesnap { display: block; width: 100%; height: 100%; }
    #message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      max-width: 32em; padding: 1em 1.5em; text-align: center; border-radius: 8px;
      background: rgba(127, 127, 127, 0.15); display: none;
    }
    #message.shown { display: block; }
  </style>
</head>
<body>
  <canvas id="snappiesnap"></canvas>
  <div id="message" class="shown">Loading SnappieSnap&hellip;</div>
  <noscript><div id="message" class="shown">SnappieSnap needs JavaScript and WebAssembly.</div></noscript>
</body>
</html>
